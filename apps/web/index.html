<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Balance</title>
        <base href="/" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/src/app/styles/styles.scss" />
        <script>
            (function () {
                /*
                 * Apply the persisted theme and locale before CSS/React paint.
                 * Keep this script in index.html to avoid first-paint flash.
                 */
                try {
                    var preference = localStorage.getItem('balance.themePreference');
                    if (preference === 'light') {
                        document.documentElement.setAttribute('data-carbon-theme', 'white');
                    } else if (preference === 'dark') {
                        document.documentElement.setAttribute('data-carbon-theme', 'g100');
                    }

                    var locale = localStorage.getItem('balance.locale');
                    if (locale === 'en' || locale === 'ru') {
                        document.documentElement.lang = locale;
                    }
                } catch (error) {
                    /* Keep the CSS system default when storage is unavailable. */
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
